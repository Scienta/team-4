<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call for papers</title>
<style>
  :root {
    --ink: #1e2b45;
    --paper: #f7f9fc;
    --slate: #5d6b80;
    --rule: #d5dce6;
    --fjord: #2f6fb0;
    --signal: #e8b422;
    --error: #b3261e;
    --font: "Avenir Next", "Avenir", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--font);
  }
  header, main { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }
  header { padding-top: 3rem; padding-bottom: 2rem; }
  h1 { font-size: 2.6rem; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 .5rem; }
  header p { color: var(--slate); max-width: 38rem; margin: 0; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }

  main { display: grid; grid-template-columns: 20rem 1fr; gap: 3rem; padding-bottom: 4rem; }
  @media (max-width: 52rem) { main { grid-template-columns: 1fr; gap: 2rem; } }

  form { margin-bottom: 2.5rem; }
  label { display: block; font-size: .9rem; font-weight: 600; margin: .75rem 0 .25rem; }
  input, select, textarea {
    width: 100%; font: inherit; color: inherit;
    padding: .5rem .6rem; border: 1px solid var(--rule); border-radius: 4px; background: #fff;
  }
  textarea { min-height: 5rem; resize: vertical; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 4px; padding: .55rem 1rem;
    background: var(--fjord); color: #fff; margin-top: 1rem;
  }
  button.quiet { background: transparent; color: var(--fjord); padding: .3rem .5rem; margin: 0; }
  button.quiet[aria-pressed="true"] { background: var(--ink); color: #fff; }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .msg { font-size: .9rem; margin: .5rem 0 0; min-height: 1.4em; }
  .msg.error { color: var(--error); }

  .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .list-head h2 { margin: 0; }
  .controls { display: flex; gap: .25rem; align-items: center; font-size: .9rem; color: var(--slate); }

  /* The talk list: each talk's length drawn to scale against a two-hour workshop. */
  ol.talks { list-style: none; padding: 0; margin: 1rem 0 0; border-top: 1px solid var(--rule); }
  .talk { padding: 1rem 0; border-bottom: 1px solid var(--rule); }
  .talk h3 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  .talk .meta { color: var(--slate); font-size: .9rem; margin: .15rem 0 .6rem; }
  .bar { position: relative; height: .6rem; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .bar span { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 3px; }
  .talk .footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: .6rem; font-size: .9rem; }
  .score { font-variant-numeric: tabular-nums; }
  .score b { color: var(--ink); }
  .rate { display: flex; gap: .2rem; align-items: center; }
  .rate button {
    margin: 0; width: 2rem; padding: .25rem 0;
    background: #fff; color: var(--ink); border: 1px solid var(--rule);
  }
  .rate button:hover { background: var(--signal); border-color: var(--signal); }
  .empty { color: var(--slate); padding: 2rem 0; }
  #reviewer { width: 4.5rem; padding: .25rem .4rem; }
</style>
</head>
<body>
<header>
  <h1>Call for papers</h1>
  <p>Registrer deg som foredragsholder, send inn opptil tre foredrag, og la programkomiteen gi dem karakter fra 1 til 5.</p>
</header>

<main>
  <section aria-label="Send inn">
    <form id="speaker-form">
      <h2>Registrer foredragsholder</h2>
      <label for="s-name">Navn</label>
      <input id="s-name" name="name" required>
      <label for="s-email">E-post</label>
      <input id="s-email" name="email" type="email" required>
      <label for="s-bio">Bio</label>
      <textarea id="s-bio" name="bio"></textarea>
      <button type="submit">Registrer</button>
      <p class="msg" id="speaker-msg" role="status"></p>
    </form>

    <form id="talk-form">
      <h2>Send inn foredrag</h2>
      <label for="t-speaker">Foredragsholder-ID</label>
      <input id="t-speaker" name="speakerId" type="number" min="1" required>
      <label for="t-title">Tittel</label>
      <input id="t-title" name="title" required>
      <label for="t-format">Format</label>
      <select id="t-format" name="format">
        <option value="LIGHTNING_10">Lyntale, 10 min</option>
        <option value="LIGHTNING_20">Lyntale, 20 min</option>
        <option value="PRESENTATION" selected>Presentasjon, 45 min</option>
        <option value="WORKSHOP">Workshop, 120 min</option>
      </select>
      <label for="t-level">Nivå</label>
      <select id="t-level" name="level">
        <option value="BEGINNER">Nybegynner</option>
        <option value="INTERMEDIATE" selected>Middels</option>
        <option value="ADVANCED">Avansert</option>
      </select>
      <button type="submit">Send inn foredrag</button>
      <p class="msg" id="talk-msg" role="status"></p>
    </form>
  </section>

  <section aria-labelledby="talks-heading">
    <div class="list-head">
      <h2 id="talks-heading">Innsendte foredrag</h2>
      <div class="controls">
        <span>Sorter:</span>
        <button class="quiet" data-sort="" aria-pressed="true">Innsendt</button>
        <button class="quiet" data-sort="rating" aria-pressed="false">Karakter</button>
        <label for="reviewer" style="margin:0 0 0 .75rem;font-weight:400">Jeg er reviewer</label>
        <input id="reviewer" type="number" min="1" value="1">
      </div>
    </div>
    <p class="msg" id="list-msg" role="status"></p>
    <ol class="talks" id="talks"></ol>
  </section>
</main>

<script>
  const FORMATS = { LIGHTNING_10: "Lyntale", LIGHTNING_20: "Lyntale", PRESENTATION: "Presentasjon", WORKSHOP: "Workshop" };
  const LEVELS = { BEGINNER: "Nybegynner", INTERMEDIATE: "Middels", ADVANCED: "Avansert" };
  const speakers = new Map();
  let sort = "";

  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.message) || `${res.status} ${res.statusText}`);
    return data;
  }

  function show(el, text, isError) {
    el.textContent = text;
    el.classList.toggle("error", !!isError);
  }

  function speakerName(id) {
    if (!speakers.has(id)) {
      speakers.set(id, api("GET", `/speakers/${id}`).then(s => s.name).catch(() => `#${id}`));
    }
    return speakers.get(id);
  }

  function el(tag, props, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  async function loadTalks() {
    const list = document.getElementById("talks");
    const msg = document.getElementById("list-msg");
    try {
      const talks = await api("GET", sort ? `/talks?sort=${sort}` : "/talks");
      list.replaceChildren();
      show(msg, "");
      if (!talks.length) {
        list.append(el("li", { className: "empty", textContent: "Ingen foredrag ennå. Send inn det første i skjemaet." }));
        return;
      }
      for (const t of talks) list.append(renderTalk(t));
    } catch (e) {
      show(msg, `Kunne ikke hente foredrag: ${e.message}`, true);
    }
  }

  function renderTalk(t) {
    const who = el("span", { textContent: `#${t.speakerId}` });
    speakerName(t.speakerId).then(n => (who.textContent = n));

    const bar = el("div", { className: "bar", title: `${t.durationMinutes} minutter` });
    const fill = el("span");
    fill.style.width = `${Math.min(100, (t.durationMinutes / 120) * 100)}%`;
    bar.append(fill);

    const score = el("span", { className: "score" });
    if (t.averageRating == null) score.textContent = "Ingen karakterer ennå";
    else score.append(el("b", { textContent: t.averageRating.toFixed(1) }), ` av 5, ${t.ratingCount} ${t.ratingCount === 1 ? "karakter" : "karakterer"}`);

    const rate = el("div", { className: "rate", role: "group", ariaLabel: `Gi karakter til ${t.title}` });
    for (let s = 1; s <= 5; s++) {
      rate.append(el("button", { type: "button", textContent: s, onclick: () => rateTalk(t.id, s) }));
    }

    return el("li", { className: "talk" },
      el("h3", { textContent: t.title }),
      el("p", { className: "meta" },
        who, `, ${FORMATS[t.format] || t.format} ${t.durationMinutes} min, ${LEVELS[t.level] || t.level}`),
      bar,
      el("div", { className: "footer" }, score, rate));
  }

  async function rateTalk(id, score) {
    const reviewer = document.getElementById("reviewer").value;
    const msg = document.getElementById("list-msg");
    try {
      await api("PUT", `/talks/${id}/ratings/${reviewer}`, { score });
      await loadTalks();
      show(msg, `Karakter ${score} lagret.`);
    } catch (e) {
      show(msg, `Kunne ikke lagre karakteren: ${e.message}`, true);
    }
  }

  document.getElementById("speaker-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = ev.target, msg = document.getElementById("speaker-msg");
    try {
      const s = await api("POST", "/speakers", { name: f.elements.name.value, email: f.elements.email.value, bio: f.elements.bio.value || null });
      show(msg, `Registrert med ID ${s.id}.`);
      document.getElementById("t-speaker").value = s.id;
      f.reset();
    } catch (e) {
      show(msg, `Kunne ikke registrere: ${e.message}`, true);
    }
  });

  document.getElementById("talk-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = ev.target, msg = document.getElementById("talk-msg");
    try {
      await api("POST", "/talks", {
        title: f.elements.title.value, format: f.elements.format.value, level: f.elements.level.value, speakerId: Number(f.elements.speakerId.value),
      });
      show(msg, "Foredraget er sendt inn.");
      f.elements.title.value = "";
      await loadTalks();
    } catch (e) {
      show(msg, `Kunne ikke sende inn: ${e.message}`, true);
    }
  });

  document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => {
    sort = b.dataset.sort;
    document.querySelectorAll("[data-sort]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    loadTalks();
  }));

  loadTalks();
</script>
</body>
</html>

server.port=8080

# The database comes from PGHOST, PGPORT, PGDATABASE, PGUSER and PGPASSWORD. sslmode is off for the
# Compose Postgres here; the Dockerfile sets PGSSLMODE=require for the container.
# socketTimeout (seconds): without it a read on a half-open connection blocks forever, because the query timeout's
# cancel goes over a new connection that fails too; the /health probe then never finishes and /health stays 503
# after the database is back. 30 s is far above any legitimate query here.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cfp}?sslmode=${PGSSLMODE:disable}&socketTimeout=30
spring.datasource.username=${PGUSER:cfp}
spring.datasource.password=${PGPASSWORD:cfp}
spring.datasource.hikari.maximum-pool-size=5
# How long a request waits for one of those 5 connections before failing (Hikari's default is 30 s). /health
# shares the pool and gives up after 5 s anyway, so a 30 s wait only holds Tomcat threads while a burst (e.g.
# 80 workshop registrations queued on one talk's row lock) drains. Not 5 s or below: Hikari also uses this as
# the driver's login timeout, and the first connection after a scale-to-zero cold start (TLS to Postgres) can
# take a few seconds; 10 s leaves room for that while still failing starved requests 3x sooner.
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info

# Kept from the 2019 setup, the mobile client depends on some of these
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.encoding.force=true
spring.jackson.json.read.allow-java-comments=true
# Boot 4 ships Jackson 3, whose defaults differ (e.g. alphabetical property order, null for primitives fails).
# Keep the Jackson 2 behaviour the clients were built against.
spring.jackson.use-jackson2-defaults=true

#logging.level.org.springframework.jdbc.core=DEBUG
cfp.block.user-agents=curl/8.5.0
